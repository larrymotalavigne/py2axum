name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-test:
    name: lint and unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,conformance]"
      - run: ruff check py2axum tests examples
      - run: python -m pytest -q
      - name: wheel builds and installs
        run: |
          pip install build && python -m build --wheel
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl && /tmp/w/bin/py2axum --help

  typed:
    name: typed backend conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: poc
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1/poc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generated/app_axum
      - run: pip install fastapi "uvicorn[standard]" "sqlalchemy[asyncio]" "psycopg[binary]" pydantic aiohttp httpx pytest
      - name: transpile (the committed output must be exactly the transpiler's)
        run: python -m py2axum app -o generated/app_axum --name app_axum && git diff --exit-code -- generated/
      - run: cd generated/app_axum && cargo build --release --locked
      - run: ./scripts_start.sh && python tests/conformance.py http://127.0.0.1:8000 http://127.0.0.1:8080
      - name: forced streaming
        run: |
          RUST_ENV="PY2AXUM_STREAM_CHUNK=256 PY2AXUM_STREAM_MIN_ROWS=0" ./scripts_start.sh
          python tests/conformance.py http://127.0.0.1:8000 http://127.0.0.1:8080 --ignore-encoding
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: typed-logs
          path: /tmp/py2axum-logs

  dyn:
    name: dyn backend conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ["5672:5672"]
    env:
      REDIS_URL: redis://127.0.0.1:6379/13
      BROKER_DSN: amqp://guest:guest@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generated/dynapp_axum
      - name: Python reference dependencies
        run: >
          pip install fastapi "uvicorn[standard]" "sqlalchemy[asyncio]" "psycopg[binary]" "pydantic[email]"
          aiohttp==3.14.3 httpx==0.28.1 pytest python-jose==3.5.0 bcrypt==5.0.0 pyotp==2.9.0 pywebpush==2.3.0
          py-vapid==1.9.4 http-ece==1.2.1 google-auth==2.49.0 requests psutil==7.2.2 alembic pydantic-settings
          sentry-sdk==2.71.0 itsdangerous==2.2.0 cryptography python-multipart==0.0.32 jinja2 aiosmtplib redis==8.1.0 aio-pika==10.0.1 tenacity==9.1.4 prometheus-client==0.26.0 nh3==0.3.6
          python-dateutil==2.9.0.post0 xmltodict==1.0.4
      - run: |
          for db in py2axum_dyn py2axum_notes; do psql -h 127.0.0.1 -U postgres -qc "CREATE DATABASE $db"; done
      - name: dynapp (reference app of the dyn backend)
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1/py2axum_dyn
        run: |
          python -m py2axum fixtures/dynapp --root . --backend dyn --python-side '/dunders/proxied/{name}' --python-side mount -o generated/dynapp_axum --name dynapp_axum
          (cd generated/dynapp_axum && cargo build --release)
          python -c "from tests.scenarios import dynapp; dynapp.reset('$DATABASE_URL')"
          ./scripts_start_dyn.sh
          python tests/conformance.py http://127.0.0.1:8200 http://127.0.0.1:8280 --scenario dynapp
      - name: factoryapp (app factory, middleware stack, exception handlers)
        run: |
          python -m py2axum fixtures/factoryapp --root . --backend dyn -o generated/factoryapp_axum --name factoryapp_axum
          (cd generated/factoryapp_axum && CARGO_TARGET_DIR=../dynapp_axum/target cargo build --release)
          ./scripts_start_factory.sh
          python tests/conformance.py http://127.0.0.1:8300 http://127.0.0.1:8380 --scenario factoryapp
      - name: examples/notes
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1/py2axum_notes
        run: |
          python -m py2axum examples/notes/app --root examples/notes --backend dyn -o generated/notes_axum --name notes
          (cd generated/notes_axum && CARGO_TARGET_DIR=../dynapp_axum/target cargo build --release)
          python -c "from tests.scenarios import notes; notes.reset('$DATABASE_URL')"
          (cd examples/notes && DATABASE_URL=postgresql+psycopg://postgres@127.0.0.1/py2axum_notes nohup uvicorn app.main:app --port 8500 --log-level warning > /tmp/notes-py.log 2>&1 &)
          (PORT=8580 nohup generated/dynapp_axum/target/release/notes > /tmp/notes-rs.log 2>&1 &)
          for i in $(seq 60); do curl -s -o /dev/null 127.0.0.1:8500/health && curl -s -o /dev/null 127.0.0.1:8580/health && break; sleep 0.5; done
          python tests/conformance.py http://127.0.0.1:8500 http://127.0.0.1:8580 --scenario notes
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: dyn-logs
          path: |
            /tmp/py2axum-logs
            /tmp/*.log

  docker:
    name: example Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/notes/Dockerfile
          tags: notes:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_DB=notes -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$PWD/examples/notes/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro" postgres:16-alpine
          for i in $(seq 60); do docker exec db pg_isready -U postgres -d notes && break; sleep 1; done
          sleep 2
          docker run -d --name notes --network t -p 8080:8080 -e DATABASE_URL=postgresql://postgres@db/notes notes:ci
          for i in $(seq 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -X POST localhost:8080/authors -H 'content-type: application/json' -d '{"name":"ada"}'
          curl -sf -X POST localhost:8080/notes -H 'content-type: application/json' -d '{"title":"hi","author_id":1}'
          test "$(curl -sf localhost:8080/notes | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["title"])')" = hi
          docker image ls notes:ci
