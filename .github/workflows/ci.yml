name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-test:
    name: lint and unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,conformance]"
      - run: ruff check py2axum tests examples
      - run: python -m pytest -q
      - name: wheel builds and installs
        run: |
          pip install build && python -m build --wheel
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl && /tmp/w/bin/py2axum --help

  dyn:
    name: conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ["5672:5672"]
    env:
      REDIS_URL: redis://127.0.0.1:6379/13
      BROKER_DSN: amqp://guest:guest@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generated/dynapp_axum
      - name: Python reference dependencies
        run: >
          pip install $(python -m py2axum.versions max) "uvicorn[standard]" "pydantic[email]"
          pytest python-jose==3.5.0 pyjwt==2.15.1 bcrypt==5.0.0 pyotp==2.9.0 pywebpush==2.3.0
          py-vapid==1.9.4 http-ece==1.2.1 google-auth==2.49.0 requests psutil==7.2.2 alembic pydantic-settings
          sentry-sdk==2.71.0 itsdangerous==2.2.0 cryptography python-multipart==0.0.32 jinja2 aiosmtplib redis==8.1.0 aio-pika==10.0.1 tenacity==9.1.4 prometheus-client==0.26.0 nh3==0.3.6
          python-dateutil==2.9.0.post0 xmltodict==1.0.4 starlette-context==0.5.1
      - run: |
          for db in py2axum_dyn py2axum_notes poc; do psql -h 127.0.0.1 -U postgres -qc "CREATE DATABASE $db"; done
      - name: dynapp (reference app of the dyn backend)
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1/py2axum_dyn
        run: |
          python -m py2axum fixtures/dynapp --root . --backend dyn --python-side '/dunders/proxied/{name}' --python-side mount -o generated/dynapp_axum --name dynapp_axum
          (cd generated/dynapp_axum && cargo build --release)
          python -c "from tests.scenarios import dynapp; dynapp.reset('$DATABASE_URL')"
          ./scripts_start_dyn.sh
          python tests/conformance.py http://127.0.0.1:8200 http://127.0.0.1:8280 --scenario dynapp
      - name: factoryapp (app factory, middleware stack, exception handlers)
        run: |
          python -m py2axum fixtures/factoryapp --root . --backend dyn -o generated/factoryapp_axum --name factoryapp_axum
          (cd generated/factoryapp_axum && CARGO_TARGET_DIR=../dynapp_axum/target cargo build --release)
          ./scripts_start_factory.sh
          python tests/conformance.py http://127.0.0.1:8300 http://127.0.0.1:8380 --scenario factoryapp
      - name: app (CRUD, GZip, aiohttp, lists streamed from the session), normal and forced streaming
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1/poc
          APP_BIN: generated/dynapp_axum/target/release/app_axum
        run: |
          python -m py2axum app -o generated/app_axum --name app_axum
          (cd generated/app_axum && CARGO_TARGET_DIR=../dynapp_axum/target cargo build --release)
          ./scripts_start.sh && python tests/conformance.py http://127.0.0.1:8000 http://127.0.0.1:8080
          RUST_ENV="PY2AXUM_STREAM_CHUNK=256 PY2AXUM_STREAM_MIN_ROWS=0" ./scripts_start.sh
          python tests/conformance.py http://127.0.0.1:8000 http://127.0.0.1:8080 --ignore-encoding
      - name: examples/notes
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1/py2axum_notes
        run: |
          python -m py2axum examples/notes/app --root examples/notes --backend dyn -o generated/notes_axum --name notes
          (cd generated/notes_axum && CARGO_TARGET_DIR=../dynapp_axum/target cargo build --release)
          python -c "from tests.scenarios import notes; notes.reset('$DATABASE_URL')"
          (cd examples/notes && DATABASE_URL=postgresql+psycopg://postgres@127.0.0.1/py2axum_notes nohup uvicorn app.main:app --port 8500 --log-level warning > /tmp/notes-py.log 2>&1 &)
          (PORT=8580 nohup generated/dynapp_axum/target/release/notes > /tmp/notes-rs.log 2>&1 &)
          for i in $(seq 60); do curl -s -o /dev/null 127.0.0.1:8500/health && curl -s -o /dev/null 127.0.0.1:8580/health && break; sleep 0.5; done
          python tests/conformance.py http://127.0.0.1:8500 http://127.0.0.1:8580 --scenario notes
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: dyn-logs
          path: |
            /tmp/py2axum-logs
            /tmp/*.log

  example:
    name: examples/bookshelf (hybrid mode, compared with FastAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookshelf
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1/bookshelf
      # the job checks equivalence, not speed: no fat LTO
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      LOG: /tmp/bookshelf-logs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generated/bookshelf
      - run: pip install -e . -r examples/bookshelf/requirements.txt httpx websockets
      - run: examples/bookshelf/compare.sh
      - name: without PY2AXUM_PYTHON_URL, a python-side path answers 404
        run: |
          (PORT=9091 generated/bookshelf/target/release/bookshelf > /tmp/bookshelf-logs/alone.log 2>&1 &)
          for i in $(seq 50); do curl -sf -o /dev/null 127.0.0.1:9091/health && break; sleep 0.1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:9091/books/export.zip)" = 404
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: example-logs
          path: /tmp/bookshelf-logs

  docker:
    name: reference Docker build (examples/docker, hybrid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: build and start (PostgreSQL, Python sidecar, binary)
        run: docker compose -f examples/docker/compose.yaml up --build --detach --wait --wait-timeout 1800
      - name: smoke test
        run: |
          for i in $(seq 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/auth/register -H 'content-type: application/json' \
            -d '{"email": "ada@example.org", "password": "correct horse battery", "display_name": "Ada"}'
          TOKEN=$(curl -sf localhost:8080/auth/login -H 'content-type: application/json' \
            -d '{"email": "ada@example.org", "password": "correct horse battery"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -sf localhost:8080/books -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"title": "Dune", "author": "Frank Herbert", "tags": ["SF"]}'
          test "$(curl -sf 'localhost:8080/books?tag=sf' | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["title"])')" = Dune
          # relayed to the Python sidecar
          curl -sf localhost:8080/books/export.zip -H "authorization: Bearer $TOKEN" -o /tmp/export.zip
          python3 -c 'import zipfile; print(zipfile.ZipFile("/tmp/export.zip").read("books.csv").decode())' | grep -q Dune
          docker image ls
      - if: failure()
        run: docker compose -f examples/docker/compose.yaml logs
