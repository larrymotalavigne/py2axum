name: Docker image

# Builds the builder image (docker/Dockerfile) of a version published on PyPI and pushes it to
# ghcr.io/<owner>/py2axum as X.Y.Z, X.Y and latest: amd64 and arm64 on native runners, an SBOM and a provenance
# attestation for each, then one multi-arch index. Called by release.yml after PyPI; run by hand
# (Actions → Docker image → Run workflow) to rebuild a published version. Uses the workflow's GITHUB_TOKEN only.
on:
  workflow_call:
    inputs:
      version:
        description: published py2axum version (X.Y.Z)
        required: true
        type: string
      latest:
        description: also tag latest
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: published py2axum version (X.Y.Z, on PyPI)
        required: true
        type: string
      latest:
        description: also tag latest
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/py2axum
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: the version is on PyPI
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release version: $VERSION"; exit 1; }
          for i in $(seq 30); do
            pip download --quiet --no-deps --dest /tmp/pypi "py2axum==$VERSION" && exit 0
            sleep 20
          done
          exit 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: PY2AXUM=py2axum==${{ inputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v5
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ inputs.latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
      - name: multi-arch index
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.title=py2axum" \
            --annotation "index:org.opencontainers.image.description=Compile a FastAPI + SQLAlchemy + Pydantic application to a Rust (axum) binary" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # the published image, pulled like a user would: build the bookshelf example with it (the CLI, then the reference
  # Dockerfile) and compare the binary with the FastAPI application
  verify:
    needs: merge
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bookshelf
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - run: docker pull "$IMAGE:$VERSION"
      - name: build examples/bookshelf with docker run
        run: |
          chmod a+w examples/bookshelf
          time docker run --rm -v "$PWD/examples/bookshelf:/app" "$IMAGE:$VERSION" build app --name bookshelf --python-side auto
          ldd examples/bookshelf/dist/bookshelf
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: conformance of the binary against FastAPI
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1/bookshelf
          SKIP_BUILD: "1"
          BIN: examples/bookshelf/dist/bookshelf
        run: |
          pip install -r examples/bookshelf/requirements.txt httpx websockets
          examples/bookshelf/compare.sh
      - name: the reference Dockerfile
        run: |
          time docker build -f examples/docker/Dockerfile --build-arg PY2AXUM_IMAGE="$IMAGE:$VERSION" -t bookshelf .
          docker image ls "$IMAGE" ; docker image ls bookshelf
