[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "py2axum"
version = "0.9.2"
description = "Ahead-of-time compiler from FastAPI + SQLAlchemy + Pydantic applications to Rust (axum), with response-level conformance testing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Larry Motalavigne" }]
keywords = ["fastapi", "rust", "axum", "compiler", "transpiler", "sqlalchemy", "pydantic", "performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Compilers",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
# the transpiler itself only needs the standard library; the extras run the conformance harness
dependencies = []

[project.optional-dependencies]
# the library ranges py2axum is tested on (py2axum/versions.py, docs/reference/versions.md); a project locking a version
# outside them is refused (--allow-untested-versions overrides)
conformance = [
    "fastapi>=0.137.0,<0.163",
    "starlette>=1.0.0,<1.11",
    "pydantic[email]>=2.12.0,<2.15",
    "pydantic-core>=2.41.1,<2.51",
    "pydantic-settings>=2.11.0,<2.17",
    "sqlalchemy[asyncio]>=2.0.44,<2.2",
    "psycopg[binary]>=3.2.12,<3.4",
    "httpx>=0.28.1,<0.29",
    "aiohttp>=3.13.0,<3.15",
    "mcp>=2.2.0,<2.3",
    "asyncpg>=0.31.0,<0.33",
    "icalendar>=7.0.0,<7.1",
    "orjson>=3.12.0,<3.14",
    "unidecode>=1.4.0,<1.5",
    "ecs-logging>=2.3.0,<2.4",
    "pyyaml>=6.0.2,<6.1",
    "croniter>=6.2.4,<6.3",
    "itsdangerous>=2.2.0,<2.3",
    "dnspython>=2.8.0,<2.9",
    "pytz>=2026.5,<2026.6",
    "python-dateutil>=2.9.0,<2.10",
    "cachetools>=7.2.2,<7.3",
    "stripe>=14.0.0,<14.5",
    "openpyxl>=3.1.5,<3.2",
    "et-xmlfile>=2.0.0,<2.1",
    "pgpy>=0.6.0,<0.7",
    "pyasn1>=0.6.4,<0.7",
    "cryptography>=50.0.2,<51",
    "reportlab>=4.4.5,<4.4.6",
    "qrcode>=8.2,<8.3",
    "pillow>=12.3.0,<12.4",
    "loguru>=0.7.2,<0.8",
    "bcrypt>=4.3.0,<5.1",
    "passlib>=1.7.4,<1.8",
    "python-dotenv>=1.2.0,<1.3",
    "uvicorn[standard]>=0.30",
]
difftest = ["httpx>=0.27", "psycopg[binary]>=3.2", "schemathesis>=4.29", "hypothesis>=6.140"]
dev = ["pytest>=8", "ruff>=0.6", "alembic>=1.13"]  # alembic: tests/test_migrations.py (translation of the migrations)
# the documentation site (mkdocs.yml)
docs = ["mkdocs-material==9.6.21"]

[project.scripts]
py2axum = "py2axum.__main__:main"

[project.urls]
Homepage = "https://github.com/larrymotalavigne/py2axum"
Documentation = "https://larrymotalavigne.github.io/py2axum/"
Changelog = "https://larrymotalavigne.github.io/py2axum/release-notes/"
Issues = "https://github.com/larrymotalavigne/py2axum/issues"

[tool.hatch.build.targets.wheel]
packages = ["py2axum"]

[tool.hatch.build.targets.sdist]
include = ["py2axum", "tests", "fixtures", "examples", "docs", "docs_src", "mkdocs.yml", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["generated", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E731", "B008", "B904", "B905", "E741", "B023"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's idiom: a list parameter defaults to [] (FastAPI copies defaults per request)
"docs_src/**" = ["B006"]
