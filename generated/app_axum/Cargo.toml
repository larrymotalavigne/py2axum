[package]
name = "app_axum"
version = "0.1.0"
edition = "2021"

# Generated by py2axum from app. Do not edit by hand: change the Python and regenerate.

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
form_urlencoded = "1"
regex = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }

[profile.release]
lto = "fat"
codegen-units = 1
