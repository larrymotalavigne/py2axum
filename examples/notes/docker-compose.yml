# docker compose -f examples/notes/docker-compose.yml up --build   (from the repository root)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  notes:
    build:
      context: ../..
      dockerfile: examples/notes/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@db/notes
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
